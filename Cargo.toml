[package]
name = "mat"
version = "0.1.0"
edition = "2024"
description = "Pretty-print Markdown in the terminal — cat for markdown"
license = "MIT"
repository = "https://github.com/vilbergs/mat"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }
terminal_size = "0.4.4"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-width = "0.2.3"

[profile.release]
lto = true
strip = true
